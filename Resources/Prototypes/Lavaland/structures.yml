# Necropolis tendrils: monster nests that trickle out fauna until destroyed,
# then collapse into a chasm with loot.

- type: entity
  id: StructureTendril
  parent: BaseStructure
  name: necropolis tendril
  description: A vile fleshy growth periodically birthing horrors from somewhere below. Destroying it should collapse the tunnels beneath.
  components:
  - type: Sprite
    sprite: Mobs/Aliens/Lavaland/tendril.rsi
    drawdepth: Mobs
    offset: 0,0.5
    layers:
    - state: tendril
    - state: unshaded
      shader: unshaded
  - type: PointLight
    radius: 2
    energy: 2.5
    color: "#c92424"
  - type: Damageable
    damageContainer: StructuralInorganic
  - type: TimedSpawner
    prototypes:
    - MobLegion
    - MobWatcherLavaland
    - MobBrimdemon
    - MobBileworm
    - MobLobstrosity
    intervalSeconds: 90
    chance: 0.4
    minimumEntitiesSpawned: 1
    maximumEntitiesSpawned: 1
  # ponytail: no cap on total spawned mobs; TimedSpawner can't count living children.
  # Slow interval keeps it sane; add a capped spawner system if servers drown in mobs.
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          CrateNecropolis:
            min: 1
            max: 1
          FloorChasmEntity:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  id: CrateNecropolis
  parent: CrateGeneric
  name: necropolis chest
  description: A rusted chest dredged up from the tunnels below the tendril.
  components:
  - type: StorageFill
    contents:
    - id: LegionCore
      amount: 2
    - id: IngotGold1
      amount: 2
    - id: MaterialDiamond1
      amount: 1
      prob: 0.5
    - id: SpaceCash500
      prob: 0.3
